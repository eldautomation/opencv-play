[device]
id = "001"
name = "Bench-Unit-1"
serial_number = "2026-00001"
date = "2026-03-06"
software_version = "0.0.1"
encryption_key = "${DEVICE_ENCRYPTION_KEY}"

image_sensor_id = "101"
source_optics_id = "201"
detect_optics_id = "301"
io_hardware_id = "401"

quality_limits_id="801"
measurement_parameters_id = "901"
# Capture mode of the images this device produces (library/capture_mode.toml).
capture_mode_id = "hd_1080"

reticle_type = "crosshair"
# "error" | "warn": what to do when an image size differs from the capture mode output size.
image_size_mismatch = "error"
# rad | deg | mrad | urad | arcmin | arcsec
tilt_unit = "deg"
rotation_unit = "deg"

# Tilt zero: "image_center" | "calibrated_point" | "measured_zero" (the last two also need
# tilt_zero_x_px / tilt_zero_y_px). Rotation zero: "image_axes" | "measured_zero" (needs
# rotation_zero_deg). measured_zero values are written by the app when a zero is set.
tilt_zero_mode = "image_center"
rotation_zero_mode = "image_axes"



